# Продакшен-стек: nginx + gunicorn (Django) + SQLite.
#
# База — один файл SQLite в ./data (bind-mount, переживает пересборку).
#
# Первый запуск на сервере (файл .env.deploy лежит рядом с compose.yml):
#   1) создать каталог под базу:  mkdir -p data
#   2) если нужно перенести данные — скопировать локальный db.sqlite3 в data/
#      (без файла при старте создастся пустая база и применятся миграции)
#   3) проверить тома media:  docker volume ls
#      если тома izostudio_media нет — создать:  docker volume create izostudio_media
#   4) поднять стек:
#        docker compose --env-file .env.deploy up -d --build
#
# Том media объявлен external — compose не создаст пустой том молча
# и не удалит его при `down -v`.

name: izostudio

services:
  web:
    build:
      context: .
    container_name: izostudio-web
    restart: always
    # Значения берутся из .env.deploy (передаётся через --env-file).
    environment:
      DEBUG: ${DEBUG:-False}
      SECRET_KEY: ${SECRET_KEY:?укажите SECRET_KEY в .env.deploy}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-localhost,127.0.0.1}
      CSRF_TRUSTED_ORIGINS: ${CSRF_TRUSTED_ORIGINS:-}
      # Единственная база — SQLite-файл в ./data (см. volumes ниже)
      SQLITE_PATH: /app/data/db.sqlite3
      GUNICORN_WORKERS: ${GUNICORN_WORKERS:-3}
      GUNICORN_TIMEOUT: ${GUNICORN_TIMEOUT:-120}
      SECURE_SSL_REDIRECT: ${SECURE_SSL_REDIRECT:-False}
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-False}
      CSRF_COOKIE_SECURE: ${CSRF_COOKIE_SECURE:-False}
    # Наружу не публикуется: доступ только через nginx
    expose:
      - "8000"
    volumes:
      - ./data:/app/data
      - media:/app/media
      - static_files:/app/staticfiles
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/admin/login/', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 90s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  nginx:
    image: nginx:1.27-alpine
    container_name: izostudio-nginx
    restart: always
    # 80/443 на хосте занимает Nginx Proxy Manager.
    # Наружу этот порт не публикуем: NPM ходит на izostudio-nginx:80 по общей сети.
    # 127.0.0.1:8081 оставлен только для отладки с самого сервера.
    ports:
      - "127.0.0.1:8081:80"
    networks:
      - default
      - npm_proxy
    volumes:
      # ВАЖНО: монтируем как конфиг сайта, а не как весь nginx.conf
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - static_files:/app/staticfiles:ro
      - media:/app/media:ro
    depends_on:
      web:
        condition: service_healthy
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  # Общая сеть с Nginx Proxy Manager. Имя задаётся в .env.deploy (NPM_NETWORK).
  # Узнать: docker network ls
  npm_proxy:
    external: true
    name: ${NPM_NETWORK:-npm_default}

volumes:
  media:
    external: true
    name: izostudio_media
  # Статика полностью пересобирается при старте контейнера, том можно создавать автоматически
  static_files:
    name: izostudio_staticfiles
