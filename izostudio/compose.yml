# Продакшен-стек: nginx + gunicorn (Django) + MySQL.
#
# Первый запуск на сервере (файл .env.deploy лежит рядом с compose.yml):
#   1) проверить, какие тома уже есть:  docker volume ls
#   2) если томов izostudio_mysql_ / izostudio_media нет — создать:
#        docker volume create izostudio_mysql_
#        docker volume create izostudio_media
#   3) поднять стек:
#        docker compose --env-file .env.deploy up -d --build
#
# Тома с данными (mysql_, media) объявлены external — compose не создаст
# пустой том молча и не удалит их при `down -v`.

name: izostudio

services:
  db:
    image: mysql:8.0
    container_name: izostudio-db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${DATABASE_ROOT_PASSWORD:?укажите DATABASE_ROOT_PASSWORD в .env.deploy}
      MYSQL_DATABASE: ${DATABASE_NAME:?укажите DATABASE_NAME в .env.deploy}
      MYSQL_USER: ${DATABASE_USER:?укажите DATABASE_USER в .env.deploy}
      MYSQL_PASSWORD: ${DATABASE_PASSWORD:?укажите DATABASE_PASSWORD в .env.deploy}
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      # Совместимость с mysqlclient и пользователями, созданными в MySQL 8.0
      - --default-authentication-plugin=mysql_native_password
    volumes:
      - mysql_:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u$$MYSQL_USER -p$$MYSQL_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  web:
    build:
      context: .
    container_name: izostudio-web
    restart: always
    # Значения берутся из .env.deploy (передаётся через --env-file).
    # Root-пароль MySQL сюда намеренно не попадает.
    environment:
      DEBUG: ${DEBUG:-False}
      SECRET_KEY: ${SECRET_KEY:?укажите SECRET_KEY в .env.deploy}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-localhost,127.0.0.1}
      CSRF_TRUSTED_ORIGINS: ${CSRF_TRUSTED_ORIGINS:-}
      DATABASE_ENGINE: ${DATABASE_ENGINE:-mysql}
      DATABASE_NAME: ${DATABASE_NAME:?укажите DATABASE_NAME в .env.deploy}
      DATABASE_USER: ${DATABASE_USER:?укажите DATABASE_USER в .env.deploy}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:?укажите DATABASE_PASSWORD в .env.deploy}
      DATABASE_HOST: ${DATABASE_HOST:-db}
      DATABASE_PORT: ${DATABASE_PORT:-3306}
      GUNICORN_WORKERS: ${GUNICORN_WORKERS:-3}
      GUNICORN_TIMEOUT: ${GUNICORN_TIMEOUT:-120}
      SECURE_SSL_REDIRECT: ${SECURE_SSL_REDIRECT:-False}
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-False}
      CSRF_COOKIE_SECURE: ${CSRF_COOKIE_SECURE:-False}
    depends_on:
      db:
        condition: service_healthy
    # Наружу не публикуется: доступ только через nginx
    expose:
      - "8000"
    volumes:
      - media:/app/media
      - static_files:/app/staticfiles
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/admin/login/', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 90s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  nginx:
    image: nginx:1.27-alpine
    container_name: izostudio-nginx
    restart: always
    ports:
      - "80:80"
    volumes:
      # ВАЖНО: монтируем как конфиг сайта, а не как весь nginx.conf
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - static_files:/app/staticfiles:ro
      - media:/app/media:ro
    depends_on:
      web:
        condition: service_healthy
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # Adminer для разовых работ с БД. По умолчанию не запускается:
  #   docker compose --env-file .env.deploy --profile tools up -d adminer
  adminer:
    image: adminer:4
    container_name: izostudio-adminer
    restart: always
    profiles: ["tools"]
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      db:
        condition: service_healthy

volumes:
  mysql_:
    external: true
    name: izostudio_mysql_
  media:
    external: true
    name: izostudio_media
  # Статика полностью пересобирается при старте контейнера, том можно создавать автоматически
  static_files:
    name: izostudio_staticfiles
