{% load static %}


<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>{{title}}</title>
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#fafafa" />
    <script>
        (function () {
            var theme = 'light';
            try {
                var saved = localStorage.getItem('izo-theme');
                if (saved === 'dark' || saved === 'light') {
                    theme = saved;
                } else if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) {
                    theme = 'dark';
                }
            } catch (e) {}
            document.documentElement.setAttribute('data-theme', theme);
        })();
    </script>
    <link rel="shortcut icon" href="{% static 'izo/images/favicon.png' type="image/x-icon" %}"/>
    <link type="text/css" rel="stylesheet" href="{% static 'izo/css/styles.css' %}"/>
</head>
<body>

<div class="all_content_wrapper">

{% block content %}

{% endblock content %}
</div>

<button type="button" class="theme-toggle" id="theme-toggle" role="switch" aria-checked="false"
        aria-label="Переключить на тёмную тему" title="Переключить тему">
    <span class="theme-toggle__icon theme-toggle__icon--sun" aria-hidden="true">
        <svg viewBox="0 0 24 24">
            <circle cx="12" cy="12" r="4"></circle>
            <path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"></path>
        </svg>
    </span>
    <span class="theme-toggle__track" aria-hidden="true">
        <span class="theme-toggle__thumb"></span>
    </span>
    <span class="theme-toggle__icon theme-toggle__icon--moon" aria-hidden="true">
        <svg viewBox="0 0 24 24">
            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
        </svg>
    </span>
</button>

<script type="text/javascript" src='{% static  "izo/js/main.js" %}'></script>
</body>
</html>
