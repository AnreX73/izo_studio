# Подключается как /etc/nginx/conf.d/default.conf (не заменяет nginx.conf целиком).
# Домен меняется здесь; список хостов в .env.deploy (ALLOWED_HOSTS) должен совпадать.

server {
    listen 80;
    # Замените на реальный домен, например: izo-studio.ru www.izo-studio.ru
    server_name _;

    server_tokens off;

    # Загрузки в CKEditor 5 ограничены 10 MB, берём с запасом
    client_max_body_size 25m;

    access_log /var/log/nginx/access.log;
    error_log  /var/log/nginx/error.log warn;

    location /static/ {
        alias /app/staticfiles/;
        expires 30d;
        access_log off;
    }

    location /media/ {
        alias /app/media/;
        expires 7d;
        access_log off;
    }

    # Совместимость со старыми абсолютными ссылками в текстах из БД:
    # /izostudio/media/uploads/... должны и дальше открываться.
    location /izostudio/media/ {
        alias /app/media/;
        expires 7d;
        access_log off;
    }

    location / {
        proxy_pass http://web:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "";
        proxy_read_timeout 120s;
        proxy_redirect off;
    }
}
